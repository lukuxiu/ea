<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>北邮 801 通信原理真题刷题</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085;
  --primary:#2563eb; --primary2:#1d4ed8; --line:#e5e7eb;
  --ok:#15803d; --bad:#dc2626; --shadow:0 8px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,select{font:inherit}
.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1100px;margin:auto;padding:14px 16px}
.title{font-size:20px;font-weight:800}
.subtitle{font-size:12px;color:var(--muted);margin-top:3px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.panel,.question-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.controls{padding:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
select{width:100%;padding:10px 12px;border:1px solid #d7dce5;border-radius:10px;background:#fff;color:var(--text)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{padding:6px 9px;border-radius:999px;background:#eef4ff;color:#2454b8;font-size:12px}
.progress{height:7px;background:#e9edf3;border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;width:0;background:var(--primary);transition:.2s}
.question-card{margin-top:14px;padding:20px}
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qmeta{font-size:13px;color:var(--muted)}
.qtitle{font-size:18px;font-weight:800;margin-top:4px}
.qtext{margin-top:18px;white-space:pre-wrap;line-height:1.8;font-size:16px;overflow-wrap:anywhere}
.bank{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cbd5e1}
.bank-title{font-size:13px;font-weight:700;margin-bottom:6px}
.bank-text{white-space:pre-wrap;font-size:14px;line-height:1.65}
.answer{margin-top:18px;padding:14px;border-radius:12px;background:#eff6ff;border-left:4px solid var(--primary);display:none}
.answer.show{display:block}
.answer-title{font-weight:800;margin-bottom:6px}
.answer-text{white-space:pre-wrap;line-height:1.7}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid #d5dae3;background:#fff;color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary2)}
.btn.ok{color:var(--ok);border-color:#bbf7d0}
.btn.bad{color:var(--bad);border-color:#fecaca}
.btn.small{padding:7px 10px;font-size:13px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.mark{font-size:12px;color:var(--muted);margin-top:8px}
details{margin-top:14px}
summary{cursor:pointer;color:#2454b8;font-size:13px}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:10px}
  .question-card{padding:15px;border-radius:14px}
  .qtitle{font-size:17px}
  .qtext{font-size:15px;line-height:1.75}
  .nav .btn{padding:11px 8px}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr 1fr}
  .title{font-size:18px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="title">北邮 801 通信原理历年真题刷题</div>
    <div class="subtitle">选择题 · 填空题 · 判断题｜GitHub Pages 静态网站｜支持跨浏览器云同步</div>
  </div>
</header>

<main class="wrap">
  <section class="panel controls">
    <div class="grid">
      <div>
        <label>年份</label>
        <select id="year"></select>
      </div>
      <div>
        <label>题型</label>
        <select id="type">
          <option value="all">全部题型</option>
          <option value="choice">选择题</option>
          <option value="fill">填空题</option>
          <option value="judge">判断题</option>
        </select>
      </div>
      <div>
        <label>题号</label>
        <select id="qid"></select>
      </div>
      <div>
        <label>刷题模式</label>
        <select id="mode">
          <option value="all">全部</option>
          <option value="unmastered">只看不会/未标记</option>
          <option value="mastered">只看已掌握</option>
        </select>
      </div>
    </div>
    <div class="stats">
      <span class="badge" id="stat"></span>
      <span class="badge" id="progressText"></span>
      <button class="btn small" id="randomBtn">随机一题</button>
      <button class="btn small" id="resetBtn">清空本机进度</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
  </section>

  <section class="panel controls" style="margin-top:12px">
    <div class="qtop">
      <div>
        <div class="qtitle" style="font-size:16px">跨浏览器云同步</div>
        <div class="subtitle" id="accountText">未登录：当前仍使用本机进度</div>
      </div>
      <span class="badge" id="syncStatus">未连接</span>
    </div>
    <div id="authArea" style="margin-top:12px">
      <div class="grid">
        <div>
          <label>同步密码</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="输入你的同步密码" style="width:100%;padding:10px 12px;border:1px solid #d7dce5;border-radius:10px">
        </div>
        <div style="display:flex;align-items:end;gap:8px">
          <button class="btn primary" id="loginBtn">登录同步</button>
          <button class="btn" id="signupBtn">首次设置密码</button>
        </div>
        <div style="display:flex;align-items:end">
          <button class="btn" id="logoutBtn" style="display:none">退出登录</button>
          <button class="btn small" id="testBtn">测试云连接</button>
        </div>
      </div>
      <div class="mark">只需要记住一个同步密码，不显示、不填写邮箱。这个密码用于登录同一份云端刷题进度；在 Chrome、Edge、手机上输入同一个密码即可同步。</div>
      <div class="mark" style="color:#b42318">首次使用：先点「首次设置密码」创建云端账号，以后只点「登录同步」。</div>
      <div class="mark" id="authHint" style="color:#b42318"></div>
    </div>
  </section>

  <section id="app"></section>
  <div class="footer">
    题目与答案来自上传的历年真题 PDF；本网站只是离线刷题界面，不对原资料中的答案进行二次校订。
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 如果第一个 CDN 被网络/浏览器拦截，自动尝试备用 CDN。
window.__loadSupabaseFallback = function(){
  if(window.supabase) return Promise.resolve();
  return new Promise(function(resolve,reject){
    var sc=document.createElement("script");
    sc.src="https://unpkg.com/@supabase/supabase-js@2";
    sc.onload=function(){resolve()};
    sc.onerror=function(){reject(new Error("Supabase JS CDN 加载失败，请检查网络或 GitHub Pages 的浏览器控制台"))};
    document.head.appendChild(sc);
  });
};
</script>
<script src="config.js"></script>
<script>
let DATA = null;
let supabase = null;
let currentUser = null;
let cloudReady = false;
let syncing = false;
let filtered = [];
let currentIndex = 0;
const $ = id => document.getElementById(id);
const storageKey = "bup801_quiz_progress_v1";

function progressMap(){
  try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch(e){return {}}
}
function saveProgress(m){localStorage.setItem(storageKey,JSON.stringify(m))}
function getState(id){return progressMap()[id]||""}
function setLocalState(id,state){
  const m=progressMap();
  if(state) m[id]=state; else delete m[id];
  saveProgress(m);
}
function setState(id,state){
  setLocalState(id,state);
  if(cloudReady && currentUser) syncOne(id,state);
}
async function syncOne(questionId,status){
  if(!currentUser || !supabase) return;
  syncing=true; updateSyncBadge("正在同步…");
  try{
    if(status){
      const {error}=await supabase.from("quiz_progress").upsert({
        user_id:currentUser.id, question_id:questionId, status, updated_at:new Date().toISOString()
      },{onConflict:"user_id,question_id"});
      if(error) throw error;
    }else{
      const {error}=await supabase.from("quiz_progress").delete().eq("user_id",currentUser.id).eq("question_id",questionId);
      if(error) throw error;
    }
    updateSyncBadge("已同步");
  }catch(e){
    console.error(e); updateSyncBadge("同步失败（本机已保存）");
  }finally{syncing=false;}
}
async function syncLocalToCloudAndLoad(){
  if(!currentUser || !supabase) return;
  syncing=true; updateSyncBadge("正在同步…");
  try{
    const {data:cloud,error}=await supabase.from("quiz_progress").select("question_id,status,updated_at").eq("user_id",currentUser.id);
    if(error) throw error;
    const cloudMap={};
    (cloud||[]).forEach(r=>cloudMap[r.question_id]=r.status);
    const local=progressMap();
    const missing=[];
    for(const [id,status] of Object.entries(local)){
      if(status && !cloudMap[id]) missing.push({user_id:currentUser.id,question_id:id,status,updated_at:new Date().toISOString()});
    }
    if(missing.length){
      const {error:e2}=await supabase.from("quiz_progress").upsert(missing,{onConflict:"user_id,question_id"});
      if(e2) throw e2;
      missing.forEach(r=>cloudMap[r.question_id]=r.status);
    }
    // Cloud is authoritative when a record already exists; local-only records have just been uploaded.
    saveProgress(cloudMap);
    updateSyncBadge("已同步");
    render();
  }catch(e){
    console.error(e); updateSyncBadge("云同步失败（本机继续可用）");
  }finally{syncing=false;}
}
function updateSyncBadge(text){
  const el=document.getElementById("syncStatus");
  if(el) el.textContent=text;
}
function category(q){return q.answerType||"fill"}

function category(q){return q.answerType||"fill"}

function populateYears(){
  const y=$("year");
  y.innerHTML='<option value="all">全部年份</option>'+DATA.years.map(x=>`<option value="${x}">${x} 年</option>`).join("");
}
function applyFilters(reset=true){
  const y=$("year").value, t=$("type").value, mode=$("mode").value;
  filtered=DATA.questions.filter(q=>{
    if(y!=="all" && String(q.year)!==y) return false;
    if(t!=="all" && category(q)!==t) return false;
    const s=getState(q.id);
    if(mode==="unmastered" && s==="mastered") return false;
    if(mode==="mastered" && s!=="mastered") return false;
    return true;
  });
  if(reset) currentIndex=0;
  renderQid();
  render();
}
function renderQid(){
  const s=$("qid");
  s.innerHTML=filtered.length?filtered.map((q,i)=>`<option value="${i}">${i+1}. ${q.year}｜${q.number}｜${q.type}</option>`).join(""):'<option>没有符合条件的题目</option>';
  if(filtered.length) s.value=currentIndex;
}
function render(){
  const app=$("app");
  if(!filtered.length){
    app.innerHTML='<div class="panel empty">当前筛选条件下没有题目。</div>';
    $("stat").textContent="0 题";
    $("progressText").textContent="0 / 0";
    $("bar").style.width="0";
    return;
  }
  const q=filtered[currentIndex];
  const state=getState(q.id);
  $("stat").textContent=`共 ${filtered.length} 题`;
  $("progressText").textContent=`第 ${currentIndex+1} / ${filtered.length} 题`;
  $("bar").style.width=((currentIndex+1)/filtered.length*100)+"%";

  const bank=q.bank?`<details class="bank"><summary>展开本年度选项词库</summary><div class="bank-text">${esc(q.bank)}</div></details>`:"";
  app.innerHTML=`
  <article class="question-card">
    <div class="qtop">
      <div>
        <div class="qmeta">${q.year} 年 · ${q.type} · ${q.number}</div>
        <div class="qtitle">${q.answerType==="judge"?"判断题":q.answerType==="choice"?"选择题":"填空题"}</div>
      </div>
      <button class="btn small" onclick="openSource()">查看原题 PDF</button>
    </div>
    <div class="qtext">${esc(q.text)}</div>
    ${bank}
    <div class="answer" id="answer">
      <div class="answer-title">参考答案</div>
      <div class="answer-text">${esc(q.answer)}</div>
      <div class="mark">答案按上传 PDF 中的参考答案整理；原资料可能存在错误或不妥之处。</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="showBtn" onclick="toggleAnswer()">显示答案</button>
      <button class="btn bad" onclick="mark('unknown')">标记：不会</button>
      <button class="btn ok" onclick="mark('mastered')">标记：掌握</button>
      <button class="btn" onclick="mark('')">取消标记</button>
      <span class="mark">当前：${state==="mastered"?"已掌握":state==="unknown"?"不会":"未标记"}</span>
    </div>
    <div class="nav">
      <button class="btn" onclick="move(-1)">上一题</button>
      <button class="btn primary" onclick="move(1)">下一题</button>
    </div>
  </article>`;
}
function esc(s){
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function toggleAnswer(){
  const a=$("answer"), b=$("showBtn");
  a.classList.toggle("show");
  b.textContent=a.classList.contains("show")?"隐藏答案":"显示答案";
}
function move(d){
  if(!filtered.length)return;
  currentIndex=(currentIndex+d+filtered.length)%filtered.length;
  $("qid").value=currentIndex;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function mark(s){
  if(!filtered.length)return;
  setState(filtered[currentIndex].id,s);
  render();
}
function openSource(){
  if(!filtered.length)return;
  const p=filtered[currentIndex].sourcePage||1;
  window.open(`source.pdf#page=${p}`,"_blank");
}
$("year").addEventListener("change",()=>applyFilters(true));
$("type").addEventListener("change",()=>applyFilters(true));
$("mode").addEventListener("change",()=>applyFilters(true));
$("qid").addEventListener("change",e=>{currentIndex=Number(e.target.value)||0;render()});
$("randomBtn").addEventListener("click",()=>{
  if(!filtered.length)return;
  currentIndex=Math.floor(Math.random()*filtered.length);
  $("qid").value=currentIndex; render();
});
$("resetBtn").addEventListener("click",()=>{
  if(confirm("确定清空本机刷题进度吗？")){
    localStorage.removeItem(storageKey); applyFilters(false);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") move(-1);
  if(e.key==="ArrowRight") move(1);
});
async function initCloud(){
  if(!window.supabase){
    try { await window.__loadSupabaseFallback(); }
    catch(e){
      updateSyncBadge("SDK加载失败");
      document.getElementById("authHint").textContent="云同步组件加载失败：请检查网络，或打开浏览器 F12 → Console 查看错误。";
      return;
    }
  }
  if(!window.SUPABASE_CONFIG || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey || SUPABASE_CONFIG.url.includes("YOUR_")){
    updateSyncBadge("未配置云同步"); document.getElementById("authHint").textContent="请先在 config.js 填入 Publishable Key。"; return;
  }
  try{
    if(!window.supabase || typeof window.supabase.createClient !== "function") throw new Error("Supabase JS SDK 未加载");
    supabase=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);
    const {data:{session},error}=await supabase.auth.getSession();
    if(error) throw error;
    await handleSession(session);
    supabase.auth.onAuthStateChange((_event,session)=>{
      setTimeout(()=>handleSession(session),0);
    });
  }catch(e){
    console.error("Supabase 初始化失败",e);
    updateSyncBadge("连接失败");
    document.getElementById("accountText").textContent="云同步连接失败"; document.getElementById("authHint").textContent="错误："+(e.message||e);
  }
}
// 为了实现“只输入密码”，网站在 Supabase 内部使用一个固定的隐藏邮箱作为唯一账号。
// 这个邮箱不会显示给用户；所有设备只需输入同一个密码即可登录同一份进度。
const INTERNAL_EMAIL = "bupt801.sync@example.com";

async function handleSession(session){
  currentUser=session?.user||null;
  const loginBtn=document.getElementById("loginBtn"), signupBtn=document.getElementById("signupBtn"), logoutBtn=document.getElementById("logoutBtn");
  const password=document.getElementById("password"), account=document.getElementById("accountText");
  if(currentUser){
    cloudReady=true;
    loginBtn.style.display="none"; signupBtn.style.display="none"; logoutBtn.style.display="inline-block";
    password.style.display="none";
    account.textContent="已登录：云端进度同步中";
    document.getElementById("authHint").textContent="同一个密码可在其他浏览器/手机登录同一份进度。";
    await syncLocalToCloudAndLoad();
  }else{
    cloudReady=false;
    loginBtn.style.display="inline-block"; signupBtn.style.display="inline-block"; logoutBtn.style.display="none";
    password.style.display="block";
    account.textContent="未登录：当前仍使用本机进度";
    updateSyncBadge("未连接");
  }
}

async function doLogin(){
  if(!supabase){ document.getElementById("authHint").textContent="云同步尚未连接，请先看“同步状态”。"; return; }
  const password=document.getElementById("password").value;
  if(!password){ document.getElementById("authHint").textContent="请输入同步密码。"; return; }
  document.getElementById("authHint").textContent="正在登录并读取云端进度…";
  try{
    const {error}=await supabase.auth.signInWithPassword({email:INTERNAL_EMAIL,password});
    if(error) throw error;
  }catch(e){
    console.error("登录错误",e);
    document.getElementById("authHint").textContent="登录失败："+(e.message||e);
    updateSyncBadge("登录失败");
  }
}

async function doSignup(){
  if(!supabase){ document.getElementById("authHint").textContent="云同步尚未连接，请先看“同步状态”。"; return; }
  const password=document.getElementById("password").value;
  if(password.length<6){ document.getElementById("authHint").textContent="同步密码至少 6 位，建议使用较强密码。"; return; }
  if(!confirm("确定用当前密码创建唯一的云同步账号吗？以后所有设备只需要输入这个密码即可同步。")) return;
  document.getElementById("authHint").textContent="正在创建云端账号…";
  try{
    const {data,error}=await supabase.auth.signUp({email:INTERNAL_EMAIL,password});
    if(error) throw error;
    if(data.session){
      document.getElementById("authHint").textContent="创建成功，已经自动登录并开始同步！";
    }else{
      document.getElementById("authHint").textContent="创建成功，但 Supabase 仍要求邮箱确认。请在 Supabase 的 Email Provider 中关闭 Confirm Email 后再试。";
    }
  }catch(e){
    console.error("首次设置密码错误",e);
    document.getElementById("authHint").textContent="创建失败："+(e.message||e)+"。如果已经创建过账号，请直接使用“登录同步”。";
  }
}
document.getElementById("loginBtn").addEventListener("click",doLogin);
document.getElementById("signupBtn").addEventListener("click",doSignup);
document.getElementById("logoutBtn").addEventListener("click",async()=>{if(supabase) await supabase.auth.signOut();});
document.getElementById("testBtn").addEventListener("click",async()=>{
  const hint=document.getElementById("authHint");
  if(!supabase){hint.textContent="测试失败：Supabase 尚未初始化。同步状态："+document.getElementById("syncStatus").textContent;return;}
  try{
    const {data,error}=await supabase.auth.getSession();
    if(error) throw error;
    hint.textContent="云连接正常。当前会话："+(data.session?"已登录":"未登录");
    updateSyncBadge("连接正常");
  }catch(e){hint.textContent="云连接失败："+(e.message||e);updateSyncBadge("连接失败");}
});

fetch("questions.json").then(r=>r.json()).then(d=>{
  DATA=d; populateYears(); applyFilters(true); initCloud();
}).catch(()=>{
  $("app").innerHTML='<div class="panel empty">questions.json 加载失败。请通过静态服务器打开本网站，或直接部署到 GitHub Pages。</div>';
});
</script>
</body>
</html>
