<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#9c5f44" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#140f0c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Olu · 考研英语作文极简应急装配库（Part A + Part B 极简母版、词槽秒换、小说六要素积木、18类书信尾段、措施8大官方句、34学术强动词、图表三大军规、上位大词速查）">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="no-referrer">
  <!-- Security: Content-Security-Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.loli.net; font-src https://fonts.gstatic.com https://gstatic.loli.net; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <title>Olu</title>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-wrap">
        <div class="brand-logo" title="Olu · 轻若清风，极速破局">🍃</div>
        <div class="brand-info">
          <div class="brand-title-row">
            <h1 class="brand-title">Olu</h1>
          </div>
          <p class="brand-desc">轻若清风 · 极速破局 | 2套母版通吃小作文 · 3大轨道通吃大作文 · 31处词槽秒换 · 自由手填抓词 · 1键复制</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="action-btn theme-toggle-btn" id="theme-toggle-btn" title="切换深色/浅色模式" aria-label="切换主题模式">
          <span class="theme-icon">🌓</span>
          <span class="btn-label">外观</span>
        </button>
        <button type="button" class="action-btn print-btn" id="print-btn" title="打印/导出为 A4 纸质背诵单" aria-label="打印导出">
          <span>🖨️</span>
          <span class="btn-label">打印</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sticky Nav Tabs -->
  <nav class="nav-bar" role="tablist" aria-label="内容导航">
    <div class="nav-inner">
      <button type="button" class="nav-tab is-active" data-tab="partA" role="tab" aria-selected="true" aria-controls="main-container">
        <span class="tab-icon">💌</span>
        <span class="tab-title">
          <span class="title-full">Part A 小作文装配</span>
          <span class="title-short">Part A 小作文</span>
        </span>
        <span class="tab-sub">事件/非事件/告示/6要素/18尾段</span>
      </button>
      <button type="button" class="nav-tab" data-tab="partB" role="tab" aria-selected="false" aria-controls="main-container">
        <span class="tab-icon">📊</span>
        <span class="tab-title">
          <span class="title-full">Part B 大作文装配</span>
          <span class="title-short">Part B 大作文</span>
        </span>
        <span class="tab-sub">图画3范式/3大论证轨/措施8句/GRA</span>
      </button>
      <button type="button" class="nav-tab" data-tab="charts" role="tab" aria-selected="false" aria-controls="main-container">
        <span class="tab-icon">📈</span>
        <span class="tab-title">
          <span class="title-full">图表专项破局仓</span>
          <span class="title-short">图表公式</span>
        </span>
        <span class="tab-sub">防流水账三军规/五元公式/半动态图</span>
      </button>
      <button type="button" class="nav-tab" data-tab="toolkit" role="tab" aria-selected="false" aria-controls="main-container">
        <span class="tab-icon">📚</span>
        <span class="tab-title">
          <span class="title-full">黄金连接词与34强动词</span>
          <span class="title-short">词库</span>
        </span>
        <span class="tab-sub">8大逻辑关系/利弊加分短语库</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="main-container" id="main-container" role="tabpanel">
    <!-- Tab content injected dynamically via app.js -->
  </main>

  <!-- Bottom Quick Status & Toast -->
  <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>

  <!-- Back to Top Button -->
  <button type="button" class="back-to-top" id="back-to-top" aria-label="回到顶部" hidden>
    <span>↑</span>
  </button>

  <!-- Footer -->
  <footer class="app-footer">
    <p>🍃 <strong>Olu</strong> | 依据《考研英语作文模板》高分体系与大纲评分规范精编</p>
    <p class="footer-tip">提示：点击文中任意黄色高亮胶囊词槽，即可唤起候选词推荐或直接手填题干专有词；点击任意例句卡片秒复制</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
